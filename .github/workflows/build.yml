name: Build & Verify Orbit Protocol WASM Contract

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Compile Smart Contract to WebAssembly
        run: npm --prefix contracts run build

      - name: Verify WASM Contract Unit Tests & Keeper Agent
        run: npm test
